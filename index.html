    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--purple);background:var(--black);font-family:Georgia,"Times New Roman",serif}.top-area{position:relative;padding:10px 1px;text-align:center}.top-area h1{margin:0}.top-area .tagline{font-size:.8em;letter-spacing:2px}.top-area a{color:var(--bright-purple);text-decoration:none;font-size:.9em;transition:color .3s}.top-area a:hover{color:var(--bright-gold)}.player-dock{padding:20px;background:var(--panel);text-align:center;border:1px solid var(--muted)}.player-wrap{position:relative;width:100%;max-width:600px;margin:0 auto;aspect-ratio:16/9}#player{width:100%;height:100%}#now-playing{margin-top:15px;font-size:1.1em;color:var(--bright-purple)}.controls{display:flex;justify-content:center;gap:10px;padding:15px;background:var(--panel)}.controls button{padding:10px 20px;background:var(--purple);color:var(--black);border:none;border-radius:5px;cursor:pointer;font-weight:bold;transition:background .3s}.controls button:hover{background:var(--bright-purple)}.controls button:disabled{background:var(--muted);cursor:not-allowed}main{padding:20px;max-width:900px;margin:0 auto}.intro{font-size:1.1em;margin-bottom:30px;color:var(--bright-purple)}main h2{color:var(--bright-purple);border-bottom:2px solid var(--purple);padding-bottom:10px;margin-top:30px}#song-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin:20px 0}article.song{background:var(--panel);padding:15px;border-left:3px solid var(--gold);cursor:pointer;transition:all .3s}.song:hover{background:var(--purple);border-left-color:var(--bright-gold)}.song-number{display:block;font-size:.8em;color:var(--muted);margin-bottom:5px}.song-title{display:block;color:var(--bright-purple);font-weight:bold}.song-title small{display:block;font-size:.75em;color:var(--muted);margin-top:5px;word-break:break-all}#reading{margin-top:30px;padding:20px;background:var(--panel);border-radius:5px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:15px;margin:20px 0}article.card{background:var(--purple);border:2px solid var(--gold);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .3s;font-size:2em}article.card:hover{background:var(--gold);color:var(--black)}.tagline{font-size:.85em;color:var(--muted);letter-spacing:1px;margin-top:5px}button#draw-cards{padding:12px 30px;background:var(--gold);color:var(--black);border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:1em;transition:background .3s;margin-top:20px}button#draw-cards:hover{background:var(--bright-gold)}
  </style>

let player=null,currentIndex=0,cardPlaylist=null,cardPosition=0;  
const titleFor=i=>`Song ${i+1}`;  
function updateButtons(){previousButton.disabled=cardPlaylist===null?currentIndex<=0:cardPosition<=0;nextButton.disabled=cardPlaylist===null?currentIndex>=ids.length-1:cardPosition>=cardPlaylist.length-1}  
function play(index){if(!ids[index])return;currentIndex=index;nowPlaying.textContent=`Now playing: ${titleFor(index)}`;if(player)player.loadVideoById({videoId:ids[index]});updateButtons();window.scrollTo(0,0)}  
function playPosition(position){if(!cardPlaylist||cardPlaylist[position]===undefined)return;cardPosition=position;currentIndex=cardPlaylist[position];nowPlaying.textContent=`Reading ${position+1} of ${cardPlaylist.length}`;if(player)player.loadVideoById({videoId:ids[currentIndex]});updateButtons();window.scrollTo(0,0)}  
function next(){if(cardPlaylist!==null){if(cardPosition<cardPlaylist.length-1)return playPosition(cardPosition+1);cardPlaylist=null;cardPosition=0;nowPlaying.textContent='Music reading complete ✦';updateButtons();return}play(currentIndex+1)}  
function previous(){if(cardPlaylist!==null){if(cardPosition>0)playPosition(cardPosition-1);return}if(currentIndex>0)play(currentIndex-1)}  
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:ids[0],playerVars:{autoplay:0,rel:0,modestbranding:1,playsinline:1},events:{onReady:()=>{window.rizneyPlayer=player;updateButtons()}}})};  
ids.forEach((id,index)=>{const row=document.createElement('article');row.className='song';row.innerHTML=`<span class="song-number">${index+1}</span><span class="song-title">♫ ${titleFor(index)}<small>${id}</small></span>`;row.onclick=()=>play(index);list.appendChild(row)});  
$('#random-song').onclick=()=>{cardPlaylist=null;cardPosition=0;play(Math.floor(Math.random()*ids.length))};previousButton.onclick=previous;nextButton.onclick=next;  
$('#draw-cards').onclick=()=>{cardPlaylist=[...ids.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(6,ids.length));cardPosition=0;reading.hidden=false;cards.innerHTML='';['✦','✧','✩','✹','❖','✻'].forEach((symbol,i)=>{if(i<cardPlaylist.length){const card=document.createElement('article');card.className='card';card.innerHTML=`<div>${symbol}</div>`;card.onclick=()=>playPosition(i);cards.appendChild(card)}})};
